.choice{display:grid;gap:12px}.choice button{background:var(--card);color:var(--ink);border:2px solid var(--line);padding:18px;text-align:left;font-size:18px;display:flex;align-items:center;gap:14px;border-radius:18px}
.choice button b{font-size:28px}.choice button small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.choice button.sel{border-color:var(--sea);background:var(--sky)}
.steps{display:flex;gap:5px;margin:0 0 14px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--sea)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}
.foot button{flex:1;padding:15px;font-size:17px}
.mic{width:76px;height:76px;border-radius:50%;font-size:32px;padding:0;display:flex;align-items:center;justify-content:center;margin:12px auto 4px;box-shadow:0 6px 18px rgba(31,122,184,.35)}
.mic.rec{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.5)}70%{box-shadow:0 0 0 18px rgba(179,38,30,0)}100%{box-shadow:0 0 0 0 rgba(179,38,30,0)}}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;padding:4px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.timer{font-size:42px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}

table.t{border-collapse:collapse;width:100%;font-size:13px}table.t td,table.t th{border:1px solid var(--line);padding:5px;text-align:left;vertical-align:top}

const norm=s=>' '+String(s||'').toLowerCase().replace(/[“”"'`]/g,'').replace(/[(),;:!?\[\]]/g,' ').replace(/\s+/g,' ')+' ';
function stem(w){return w.replace(/(ing|ings|ed|es|s)$/,'').replace(/\.$/,'')}
function parseQ(q){let s=norm(q);const concepts=[];
 const all=[];GROUPS.forEach((g,gi)=>g.forEach(p=>all.push([p,gi])));all.sort((a,b)=>b[0].length-a[0].length);
 const used=new Set();
 for(const [p,gi] of all){const pp=p.endsWith(' ')?p:p;const re=new RegExp('(^|[^a-z0-9])'+pp.trim().replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+(p.endsWith(' ')?'(?![a-z0-9])':''),'i');
  if(re.test(s)){if(!used.has(gi)){concepts.push({g:gi,terms:GROUPS[gi]});used.add(gi)}s=s.replace(re,' ')}}
 s.split(' ').filter(w=>w&&!STOP.has(w)&&w.length>1).forEach(w=>concepts.push({w:stem(w)}));
 return concepts}
function hit(text,c){if(c.g!=null)return c.terms.some(t=>{const tt=t.trim();return tt.length<=3?new RegExp('(^|[^a-z0-9])'+tt.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+'([^a-z0-9]|$)').test(text):text.includes(tt)});
 if(/^\d/.test(c.w))return text.includes(c.w);return new RegExp('(^|[^a-z0-9])'+c.w.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')).test(text)}
function rank(list,cs,strict){const out=[];for(const it of list){let sc=0,m=0;for(const c of cs){let best=0;for(const [t,w] of it.f)if(hit(t,c))best=Math.max(best,w);if(best){m++;sc+=best}}
 if(!m)continue;if(strict&&m<cs.length)continue;out.push({r:it.r,sc:sc+(m===cs.length?20:0),full:m===cs.length})}return out.sort((a,b)=>b.sc-a.sc)}

  if(r.layoutStamp!=null&&r.layoutStamp!==((await DB.get('kv','layoutStamp'))||0)){try{await fetchLayout()}catch(e){}}
  const ff=fileFail?`\n⚠ ${fileFail} photo/file not sent yet – it will retry automatically`:'';
  if(manual)toast(`✅ Sent updates to CE Sethu Database successfully\n(${sent} update(s) sent${up?', '+up+' photo/file(s)':''}, ${dn} received)`+ff,4500,true);
  else if(wantMsg)toast('✅ Update sent to CE Sethu Database successfully'+ff,4000,true);

async function compress(file){if(!/^image\//.test(file.type)||/gif|svg/.test(file.type))return file;

  const M=1600,k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  const b=await new Promise(res=>c.toBlob(res,'image/jpeg',0.8));return b&&b.size<file.size?b:file}catch(e){return file}}
const MAX5=5*1024*1024;
const isPhoto=f=>/^image\//.test(f.type||'')&&!/gif|svg/.test(f.type||'');
/* photo over 5 MB → made smaller until it is under 5 MB (null if the phone cannot read it) */
async function fit5(f){if(!isPhoto(f)||f.size<=MAX5)return f;
 try{const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});URL.revokeObjectURL(url);
  for(const [M,q] of [[3200,.85],[2600,.82],[2000,.8],[1600,.78],[1200,.75]]){const k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);const b=await new Promise(res=>c.toBlob(res,'image/jpeg',q));if(b&&b.size<=MAX5)return b}}catch(e){}return null}

 for(const f of files){const name=enc.encode(f.name),data=f.data,crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
  h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
  parts.push(new Uint8Array(h.buffer),name,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
  c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  central.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length}
 const csize=central.reduce((a,x)=>a+x.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
 return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/zip'})}

function panZoom(el,get,set,done){const P=new Map();let st=null;

  st={px:v.px,py:v.py,zoom:v.zoom,x:pts[0].x,y:pts[0].y,d:pts.length>1?Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y):0};e.preventDefault()});
 el.addEventListener('pointermove',e=>{if(!P.has(e.pointerId)||!st)return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});const pts=[...P.values()];const r=el.getBoundingClientRect();
  if(pts.length>1&&st.d){set({zoom:clamp(st.zoom*Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)/st.d,1,4)})}
  else{const k=1.6/Math.max(1,st.zoom);set({px:clamp(st.px-(pts[0].x-st.x)/r.width*100*k,0,100),py:clamp(st.py-(pts[0].y-st.y)/r.height*100*k,0,100)})}});
 const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);if(P.size){const v=get();const p=[...P.values()][0];st={px:v.px,py:v.py,zoom:v.zoom,x:p.x,y:p.y,d:0}}else{st=null;done&&done()}};
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}

function tileDrag(grid,onDone,onTap){let drag=null,sx=0,sy=0,moved=false;

  const over=document.elementsFromPoint(e.clientX,e.clientY).map(x=>x.closest&&x.closest('.tile')).find(x=>x&&x!==drag&&grid.contains(x));
  if(over){const all=[...grid.children];if(all.indexOf(over)>all.indexOf(drag))over.after(drag);else over.before(drag)}});

async function fileToDataURL(f){const b=await compress(f);return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
/* same maths as CSS object-fit:cover + object-position + scale(z) around that point */
function drawCover(ctx,img,S2,px,py,z){const s0=Math.max(S2/img.naturalWidth,S2/img.naturalHeight);const W=img.naturalWidth*s0,H=img.naturalHeight*s0;
 const ox=S2*px/100,oy=S2*py/100,x0=(S2-W)*px/100,y0=(S2-H)*py/100;ctx.drawImage(img,ox+(x0-ox)*z,oy+(y0-oy)*z,W*z,H*z)}
async function pngBytes(img,size,st){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.imageSmoothingQuality='high';drawCover(x,img,size,st.px,st.py,st.zoom);
 const b=await new Promise(r=>c.toBlob(r,'image/png'));return new Uint8Array(await b.arrayBuffer())}

const fmtMB=n=>!n?'':n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(1)+' MB';
function srFileRow(e,f){return `<div class="srf" data-srdl="${f.fid}" data-e="${e.id}"><b>${/^image\//.test(f.mime)?'🖼️':/pdf/.test(f.mime)?'📕':'📄'}</b><span>${esc(f.name||'file')}<small>${fmtMB(f.size)}${f.size?' · ':''}tap to download</small></span></div>`}
function srCard(e){return `<div class="srr"><div class="srt"><b>${esc(e.title)}</b>${e.test?' <span class="chip test">TEST</span>':''}</div><div class="xs mut">${esc(longD(e.date))} ${esc(e.time)} · ${esc(e.rank)} – ${esc(e.name)}${e.pending?' · 🕓 waiting to send':''}</div>
 ${(e.files||[]).map(f=>srFileRow(e,f)).join('')}${isChief()?`<button class="ghost sm srdel" data-srdel="${e.id}">🗑 Delete</button>`:''}</div>`}
function bindSr(root){root.querySelectorAll('[data-srdl]').forEach(v=>v.onclick=async()=>{const e=S.entries.find(x=>x.id===v.dataset.e);const f=e&&e.files.find(x=>x.fid===v.dataset.srdl);if(!f)return;const sm=v.querySelector('small');sm.textContent='⏳ downloading…';
  const u=await fileURL(f);if(!u){sm.textContent='not downloaded – needs internet';return}const a=document.createElement('a');a.href=u;a.download=f.name||'file';document.body.appendChild(a);a.click();a.remove();sm.textContent='✔ downloaded';});
 root.querySelectorAll('[data-srdel]').forEach(b=>b.onclick=async()=>{if(!b.dataset.c){b.dataset.c=1;b.textContent='Tap again to delete';return}const e=S.entries.find(x=>x.id===b.dataset.srdel);e.deleted=true;e.pending=true;e.editBy=S.user.rank+' '+S.user.name;await saveEntry(e);sendReceive(false);toast('Service report deleted');render()})}
/* list of DD jobs (add mode) or jobs with reports (view mode) */
function renderSreports(){const all=srs();const by={};all.forEach(e=>{const k=e.job||'GEN';(by[k]=by[k]||[]).push(e)});
 if(SRP.add){let L=SRP.q?search(SRP.q,'jobs',300).map(x=>x.r):D.jobs.slice().sort((a,b)=>a.id.localeCompare(b.id));
  shell('Add service report','Pick the DD job – or General',`<input id="srq" placeholder="Search job number or name, e.g. 600.13 or air cooler" value="${esc(SRP.q)}" enterkeyhint="search">
  <div class="card" style="padding:4px 14px;margin-top:10px"><div class="item" data-srj="GEN" style="cursor:pointer"><b>📁 General – no DD job</b><div class="xs mut">${(by.GEN||[]).length} report(s)</div></div>
  ${L.slice(0,SRP.show).map(j=>`<div class="item" data-srj="${j.id}" style="cursor:pointer"><span class="jid">${j.id}</span> <b>${esc(j.title)}</b><div class="xs mut">${esc(j.dept)} · ${esc(j.perf)}${(by[j.id]||[]).length?` · <b>${by[j.id].length} report(s)</b>`:''}</div></div>`).join('')}
  ${L.length>SRP.show?`<button class="ghost" id="srmore" style="width:100%;margin:8px 0">Show more (${L.length-SRP.show})</button>`:''}</div>`,{back:()=>{SRP.add=false;go('home')}});
  const q=$('#srq');q.oninput=()=>{SRP.q=q.value;SRP.show=40;const pos=q.selectionStart;renderSreports();const n=$('#srq');n.focus();n.setSelectionRange(pos,pos)};
  if($('#srmore'))$('#srmore').onclick=()=>{SRP.show+=60;renderSreports()};
  $('#app').querySelectorAll('[data-srj]').forEach(b=>b.onclick=()=>openSrJob(b.dataset.srj));return}
 const keys=Object.keys(by).sort((a,b)=>a==='GEN'?1:b==='GEN'?-1:a.localeCompare(b));
 const q=SRP.q.toLowerCase().trim();const vis=keys.filter(k=>!q||(k+' '+srJobName(k)+' '+by[k].map(e=>e.title).join(' ')).toLowerCase().includes(q));
 shell('Service reports',`${all.length} report(s) under ${keys.length} job(s)`,`<button id="sradd" style="width:100%">➕ Add service report</button>
 <input id="srq" placeholder="Search job or report title" value="${esc(SRP.q)}" style="margin-top:10px" enterkeyhint="search">
 ${vis.map(k=>`<div class="card srj"><div class="srjh" data-srj="${k}">${k==='GEN'?'<b>📁 General – no DD job</b>':`<span class="jid">${k}</span> <b>${esc(srJobName(k))}</b>`} <span class="xs mut">· ${by[k].length} report(s)</span></div>${by[k].map(srCard).join('')}</div>`).join('')||'<div class="card mut s">No service reports yet.</div>'}
 ${all.length?`<div class="card"><b>⬇ Download all as one zip</b><div class="s mut">Folder per job (number + name), General for documents without a job.</div>
  <label class="l">Jobs</label><div class="seg wrap" id="srsel"><button data-srall="1" class="${Object.keys(SRP.sel).length?'':'on'}">All jobs</button>${keys.map(k=>`<button data-srk="${k}" class="${SRP.sel[k]?'on':''}">${k==='GEN'?'General':k}</button>`).join('')}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="min-width:0"><label class="l">From date (optional)</label><input type="date" id="srf" value="${SRP.from}"></div><div style="min-width:0"><label class="l">To date (optional)</label><input type="date" id="srt" value="${SRP.to}"></div></div>
  <button id="srzip" style="width:100%;margin-top:12px">⬇ Download zip</button><div class="xs mut" id="srzm" style="margin-top:6px">Needs internet for files added on other phones.</div></div>`:''}`,{back:()=>go('home')});
 $('#sradd').onclick=()=>{SRP.add=true;SRP.q='';SRP.show=40;renderSreports()};
 const qi=$('#srq');qi.oninput=()=>{SRP.q=qi.value;const pos=qi.selectionStart;renderSreports();const n=$('#srq');n.focus();n.setSelectionRange(pos,pos)};
 $('#app').querySelectorAll('[data-srj]').forEach(b=>b.onclick=()=>openSrJob(b.dataset.srj));bindSr($('#app'));
 if($('#srsel')){$('#srsel').querySelectorAll('[data-srk]').forEach(b=>b.onclick=()=>{if(SRP.sel[b.dataset.srk])delete SRP.sel[b.dataset.srk];else SRP.sel[b.dataset.srk]=1;renderSreports()});
  $('#srsel').querySelector('[data-srall]').onclick=()=>{SRP.sel={};renderSreports()};
  $('#srf').onchange=e=>{SRP.from=e.target.value};$('#srt').onchange=e=>{SRP.to=e.target.value};$('#srzip').onclick=srZip}}
async function srZip(){const m=$('#srzm');if(SRP.from&&SRP.to&&SRP.to<SRP.from){toast('"To date" is before "From date"');return}
 const L=srs().filter(e=>(!Object.keys(SRP.sel).length||SRP.sel[e.job||'GEN'])&&(!SRP.from||e.date>=SRP.from)&&(!SRP.to||e.date<=SRP.to));if(!L.length){m.textContent='No reports match.';return}
 $('#srzip').disabled=true;try{if(navigator.onLine){m.textContent='Syncing first…';await sendReceive(false)}
  const files=[],used={},idx=['Front Duke DD 2026 – service reports',''];let k=0,miss=0;const tot=L.reduce((a,e)=>a+e.files.length,0);
  for(const e of L.slice().reverse()){const dir=e.job?fsn(e.job+' '+srJobName(e.job)):'General';
   for(const f of e.files){k++;m.textContent=`Collecting file ${k} of ${tot}…`;const b=await getBlob(f).catch(()=>null);if(!b){miss++;continue}
    const ext=(String(f.name||'').match(/\.[A-Za-z0-9]{1,5}$/)||[''])[0];let base=dir+'/'+e.date+' '+fsn(e.title)+(e.files.length>1?' - '+fsn(String(f.name||'file').replace(/\.[A-Za-z0-9]{1,5}$/,'')):'');let name=base+ext,c=2;while(used[name])name=base+' ('+(c++)+')'+ext;used[name]=1;
    idx.push(name+'  |  '+e.rank+' – '+e.name);files.push({name,data:new Uint8Array(await b.arrayBuffer())})}}
  files.push({name:'_list_of_reports.txt',data:new TextEncoder().encode(idx.join('\r\n'))});
  m.textContent='Making zip…';const fn='FrontDuke_ServiceReports_'+today()+'.zip';downloadBlob(makeZip(files),fn);m.textContent=`✔ ${fn} – ${files.length-1} file(s)${miss?', '+miss+' could not be downloaded (sync later)':''}`}
 catch(e){m.textContent='Failed: '+e.message}finally{$('#srzip').disabled=false}}
function openSrJob(id){const L=srOf(id);const j=J[id];
 sheet(`<div>${id==='GEN'?'<b style="font-size:18px">📁 General – no DD job</b>':`<span class="jid" style="font-size:19px">${id}</span> <b style="font-size:18px">${esc(j.title)}</b><div class="xs mut">${esc(j.dept)} · ${esc(j.perf)}</div>`}</div>
 <button id="srnew" style="width:100%;margin:12px 0">➕ Add report</button>
 ${L.length?L.map(srCard).join(''):'<div class="s mut">No service reports for this job yet.</div>'}`);
 bindSr($('#sheetIn'));$('#srnew').onclick=()=>{closeSheet();SRP.job=id;SRP.title='';SRP.files=[];go('sradd')}}
function renderSrAdd(){const id=SRP.job;if(!id){go('sreports');return}
 shell('Add report',id==='GEN'?'General – no DD job':id+' '+srJobName(id),`<div class="card"><div>${id==='GEN'?'<b>📁 General – no DD job</b>':`<span class="jid">${id}</span> <b>${esc(srJobName(id))}</b>`}</div>
 <label class="l">Report title <span class="req">required</span></label><input id="srti" value="${esc(SRP.title)}" placeholder="e.g. Everllence ME service report">
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="ghost" id="srcam">📷 Take photo</button><button class="ghost" id="srfile">📁 Choose files</button></div>
 <div class="xs mut" style="margin-top:6px">Any file type – PDF, photos, Word, Excel… Up to 10 MB per file. Photos are kept in original quality.</div>
 <div id="srlist" style="margin-top:10px">${SRP.files.map(f=>`<div class="srf"><b>${/^image\//.test(f.mime)?'🖼️':/pdf/.test(f.mime)?'📕':'📄'}</b><span>${esc(f.name)}<small>${fmtMB(f.size)}</small></span><button class="ghost sm" data-srrm="${f.fid}">✕</button></div>`).join('')||'<div class="xs mut">No files added yet.</div>'}</div></div>
 <input type="file" id="srIc" accept="image/*" capture="environment" class="hidden"><input type="file" id="srIf" multiple class="hidden">`,
 {back:()=>{go('sreports')},foot:`<div class="foot"><button class="ghost" id="srx" style="flex:1">Cancel</button><button id="srsv" style="flex:2">✔ Save report</button></div>`});
 $('#srti').oninput=e=>{SRP.title=e.target.value};
 const add=async inp=>{for(const f0 of [...inp.files]){let f=f0;if(isPhoto(f0)&&f0.size>SRMAX){f=await fit5(f0);if(!f){toast(`${f0.name} – photo could not be made under 5 MB, skipped`,5000);continue}toast('Photo made smaller to fit 5 MB',2500)}
   else if(f.size>SRMAX){toast(`${f.name} is ${fmtMB(f.size)} – maximum is 5 MB per file`,5000);continue}
   const fid='s'+uid();await DB.put('blobs',f,fid);let name=f0.name||('photo_'+nowTime().replace(':','')+'.jpg');if(f!==f0)name=name.replace(/\.[A-Za-z0-9]{1,5}$/,'')+'.jpg';if(!/\.[A-Za-z0-9]{1,5}$/.test(name))name+=/^image\//.test(f.type)?'.jpg':'';
   SRP.files.push({fid,name,mime:f.type||'application/octet-stream',size:f.size})}inp.value='';renderSrAdd()};
 $('#srcam').onclick=()=>{const i=$('#srIc');i.onchange=()=>add(i);i.click()};$('#srfile').onclick=()=>{const i=$('#srIf');i.onchange=()=>add(i);i.click()};
 $('#app').querySelectorAll('[data-srrm]').forEach(b=>b.onclick=async()=>{await DB.del('blobs',b.dataset.srrm);SRP.files=SRP.files.filter(f=>f.fid!==b.dataset.srrm);renderSrAdd()});
 $('#srx').onclick=async()=>{for(const f of SRP.files)await DB.del('blobs',f.fid);SRP.files=[];go('sreports')};
 $('#srsv').onclick=async()=>{const title=$('#srti').value.trim();if(!title){toast('Please write the report title');return}if(!SRP.files.length){toast('Please add at least one file');return}
  const e={id:'s'+uid(),kind:'sreport',dept:'',perf:'',job:id==='GEN'?'':id,jobTitle:id==='GEN'?'':srJobName(id),status:'',title,text:title,rank:S.user.rank,name:S.user.name,device:S.user.device,date:today(),time:nowTime(),ts:new Date().toISOString(),
   files:SRP.files,test:!!S.testMode,deleted:false,pending:true,updated:Date.now()};
  try{await saveEntry(e)}catch(err){toast('Could not save on this phone: '+err.message,5000);return}
  SRP.files=[];SRP.title='';toast(navigator.onLine?'✅ Service report saved – sending…':'📱 Saved on this phone – it will be sent when internet is back',4000,true);SRP.add=false;SRP.q='';go('sreports');openSrJob(id);sendReceive('save')}}
/* ================= boot ================= */
let SWREG=null;
async function boot(){try{await loadState()}catch(e){$('#app').innerHTML='<div style="padding:20px">This browser blocks offline storage (private mode?). Open the app in normal Safari/Chrome.</div>';return}
 render();if(S.user&&D){autoSync();afterSync()}
 setInterval(()=>{if(S.user&&D)sendReceive(false)},60*60*1000);
 window.addEventListener('online',()=>{if(S.user&&D)sendReceive(false)});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.user&&D)autoSync()});
 if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{SWREG=await navigator.serviceWorker.register('sw.js');
  const ask=w=>{const b=document.createElement('div');b.className='toast';b.style.display='block';b.style.bottom='auto';b.style.top='calc(70px + env(safe-area-inset-top))';b.innerHTML='New version available <button class="sm" style="margin-left:8px">Update</button>';document.body.appendChild(b);b.querySelector('button').onclick=()=>{S.updateAsked=true;w.postMessage('skip')}};
  if(SWREG.waiting)ask(SWREG.waiting);
  SWREG.addEventListener('updatefound',()=>{const w=SWREG.installing;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ask(w)})});
  let rl=false;const hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!rl&&S.updateAsked){rl=true;location.reload()}});setInterval(()=>SWREG.update(),30*60*1000)}catch(e){}}}
boot();
</script>
