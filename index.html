<body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="viewer" id="viewer"><img id="vimg" alt=""><button class="ghost sm" id="vclose">✕ Close</button></div>
<div class="toast" id="toast"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fGal" accept="image/*,video/*,application/pdf,.pdf,.doc,.docx,.xls,.xlsx" multiple class="hidden">
<script>
"use strict";
/* ================= constants ================= */
const VERSION='1.9.0';
const CFG=Object.assign({SERVER_URL:'',VESSEL:'MT Front Duke'},window.APP_CONFIG||{});
const RANKS=[['Master','Deck'],['Chief Officer','Deck'],['Second Officer','Deck'],['Third Officer','Deck'],['Deck Cadet','Deck'],['Chief Engineer','Engine'],['Second Engineer','Engine'],['Third Engineer','Engine'],['Fourth Engineer','Engine'],['Electrical Engineer','Engine'],['Superintendent','Office'],['Yard visitor','Office']];
const REPORT_RANKS=['Chief Engineer','Master','Chief Officer','Second Engineer','Electrical Engineer','Vessel Manager'];
const EXTRACT_RANKS=['Chief Engineer','Master','Chief Officer','Second Engineer','Vessel Manager'];
const JST={ns:['Not started',''],ip:['In progress','warn'],co:['Completed','ok'],ca:['Cancelled','bad']};
const SUBS=['Dis-assembly in progress','Given to Yard','Received from Yard','Assembly in progress','Testing in progress','Service Engineer work in progress'];
function stText(e){if(!e||!JST[e.jst])return '';const L=JST[e.jst][0];if(e.jst==='ip')return L+(e.sub?' – '+e.sub:'');if(e.jst==='co')return L+(e.cdate?' on '+longD(e.cdate):'');if(e.jst==='ca')return L+' – VM/Owner approval: '+(e.appr||'—');return L}
function stLabel(e){return e.jst==='ip'?'Status details':e.jst==='ca'?'Reason for cancellation':'Comment'}

function answer(q){
 const ids=[...new Set((q.match(/\b\d{3}\.\d{2}\b/g)||[]).filter(x=>J[x]))];

 const viaPo=pos.flatMap(p=>O[p].jobs.map(x=>x.id)).filter(x=>J[x]);

 const found=qq?search(qq,'jobs',120).map(x=>x.r.id):[];

 const notes=[];pos.forEach(p=>{if(!O[p].jobs.some(x=>J[x.id]))notes.push(p+' is not linked to any DD spec job')});
 const sum=jobs.length?`${jobs.length} job(s) – closest match first. Tap a tab to open it.`:'No DD spec job matches – try other words or a job number like 630.13.';
 return {jobs,sum:sum+(notes.length?' · '+notes.join(' · '):'')}}
const jobOrders=id=>D.orders.filter(o=>o.jobs.some(x=>x.id===id));
function jobUpdates(id){const re=new RegExp('(^|[^\\d.])'+id.replace('.','\\.')+'(?![\\d])');
 return live().filter(e=>e.kind!=='meeting'&&(e.job===id||re.test(String(e.text||'')))).sort((a,b)=>String(b.ts).localeCompare(String(a.ts)))}
/* mail matching: job number in the mail · one of the job's reqn numbers · or words of the job title in the same line */
const MSTOP=new Set('the and for with from into onto all any new old type unit units nos set sets job jobs to in on at by as or be is are per incl including each both other etc also via up out off one two three four five six side area areas system systems equipment general various item items work works check checks inspection inspect renew renewal renewing replace replacement repair repairs overhaul overhauling overhauled cleaning clean service servicing survey surveys test testing tests maintenance install installation fitting fit supply supplied provide removal remove dd docking drydock dock spec vessel ship front duke duchess yard shipyard owner owners class engineer external party parties'.split(' '));
const mtok=s=>(String(s||'').toLowerCase().match(/[a-z0-9]+(?:\/[a-z0-9]+)?/g)||[]).filter(w=>w.length>=3&&!MSTOP.has(w)&&!/^\d+$/.test(w));
let MIDX=null;
function mailIdx(){if(MIDX)return MIDX;const jt={},df={};D.jobs.forEach(j=>{jt[j.id]=[...new Set(mtok(j.title+' '+j.comp))];jt[j.id].forEach(w=>df[w]=(df[w]||0)+1)});
 const seen=new Set();const ms=[];D.msgs.forEach((m,i)=>{const k=(m.date||'')+'|'+m.frm+'|'+m.subj+'|'+String(m.text).slice(0,200);if(seen.has(k))return;seen.add(k);
  ms.push({i,lines:[m.subj].concat(String(m.text).split(/\n|[.!?]\s/)).filter(l=>l.trim()).map(l=>new Set(mtok(l))),subj:new Set(mtok(m.subj))})});

 const T=X.jt[id].filter(w=>X.df[w]<=12);const strong=T.filter(w=>X.df[w]<=3);const out=[];
 X.ms.forEach(x=>{const m=D.msgs[x.i];let why='';
  if(m.jobs.includes(id))why='Job '+id+' named in mail';
  else{const p=m.pos.find(p=>nos.includes(p)||n8.includes(p.slice(0,8)));if(p)why='Reqn '+p+' named in mail'}
  if(!why&&strong.length){for(const L of x.lines){const h=T.filter(w=>L.has(w));if(h.length>=2&&h.some(w=>X.df[w]<=3)){why='≈ matched by words: '+h.join(', ');break}}

/* clean mail: drop quoted older mails, disclaimers and the signature block */
const MCUT=/^(-{5,}|_{5,}|-+\s*(original message|forwarded)|-+\s*원본|(from|fra|sent|von|de|sendt|envoyé):\s|on .{5,90}(wrote|skrev)\s*:?$|confidential|disclaimer|this e-?mail (may|is|and|\(incl)|the information (in|contained))/i;

  return edit?`<div class="tile${hid?' hid':''}" data-tid="${k}"><b>${i}</b>${l}${k==='settings'?'<span class="eye lock" title="Always shown">🔒</span>':`<span class="eye" data-eye="${k}">${hid?'🚫':'👁'}</span>`}</div>`:`<button class="tile" data-go="${k}"><b>${i}</b>${l}</button>`}).join('')}</div>`}
function creditHTML(L){return `<div class="credit" style="font-size:${clamp(+L.creditSize||10.5,8,18)}px;text-align:${L.creditAlign||'right'}">Conceptualized by CE<br>Powered by Team Front Duke 2026</div>`}
async function fetchLayout(){const r=await api('getLayout',{},60000);S.layout=r.layout||null;await DB.put('kv',S.layout,'layout');await DB.put('kv',r.layoutStamp||0,'layoutStamp');applyScale(lay())}
/* --- pan / pinch helper --- */
function panZoom(el,get,set,done){const P=new Map();let st=null;
 el.addEventListener('pointerdown',e=>{if(e.target.closest('button,input'))return;el.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});const v=get();const pts=[...P.values()];
  st={px:v.px,py:v.py,zoom:v.zoom,x:pts[0].x,y:pts[0].y,d:pts.length>1?Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y):0};e.preventDefault()});
 el.addEventListener('pointermove',e=>{if(!P.has(e.pointerId)||!st)return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});const pts=[...P.values()];const r=el.getBoundingClientRect();
  if(pts.length>1&&st.d){set({zoom:clamp(st.zoom*Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)/st.d,1,4)})}
  else{const k=1.6/Math.max(1,st.zoom);set({px:clamp(st.px-(pts[0].x-st.x)/r.width*100*k,0,100),py:clamp(st.py-(pts[0].y-st.y)/r.height*100*k,0,100)})}});
 const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);if(P.size){const v=get();const p=[...P.values()][0];st={px:v.px,py:v.py,zoom:v.zoom,x:p.x,y:p.y,d:0}}else{st=null;done&&done()}};
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
/* --- tile drag --- */
function tileDrag(grid,onDone){let drag=null,sx=0,sy=0,moved=false;
 grid.addEventListener('pointerdown',e=>{const t=e.target.closest('.tile');if(!t||e.target.closest('[data-eye]'))return;drag=t;sx=e.clientX;sy=e.clientY;moved=false;t.setPointerCapture(e.pointerId);e.preventDefault()});
 grid.addEventListener('pointermove',e=>{if(!drag)return;if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)<6)return;if(!moved){moved=true;drag.classList.add('drag')}
  const over=document.elementsFromPoint(e.clientX,e.clientY).map(x=>x.closest&&x.closest('.tile')).find(x=>x&&x!==drag&&grid.contains(x));
  if(over){const all=[...grid.children];if(all.indexOf(over)>all.indexOf(drag))over.after(drag);else over.before(drag)}});
 const end=()=>{if(!drag)return;drag.classList.remove('drag');drag=null;if(moved)onDone([...grid.children].map(x=>x.dataset.tid))};
 grid.addEventListener('pointerup',end);grid.addEventListener('pointercancel',end)}
/* --- read a picked image file as a (compressed) data URL --- */
async function fileToDataURL(f){const b=await compress(f);return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
/* same maths as CSS object-fit:cover + object-position + scale(z) around that point */
function drawCover(ctx,img,S2,px,py,z){const s0=Math.max(S2/img.naturalWidth,S2/img.naturalHeight);const W=img.naturalWidth*s0,H=img.naturalHeight*s0;
 const ox=S2*px/100,oy=S2*py/100,x0=(S2-W)*px/100,y0=(S2-H)*py/100;ctx.drawImage(img,ox+(x0-ox)*z,oy+(y0-oy)*z,W*z,H*z)}
async function pngBytes(img,size,st){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.imageSmoothingQuality='high';drawCover(x,img,size,st.px,st.py,st.zoom);
 const b=await new Promise(r=>c.toBlob(r,'image/png'));return new Uint8Array(await b.arrayBuffer())}

function renderEditHome(){const L=ED.L;applyScale(L);
 shell('Edit home screen','Chief only · seen on all phones after Save',`
 <div class="banner info">✏️ Edit mode. Nothing changes on other phones until you tap <b>Save for all phones</b>.</div>
 ${heroHTML(L,true)}
 <div class="card"><b>🖼️ Ship photo</b>

  <label class="l">Zoom <span id="zv">${L.zoom.toFixed(1)}×</span></label><input type="range" id="pz" min="1" max="4" step="0.05" value="${L.zoom}">
  <label class="l">Photo height <span id="hv">${L.photoH}px</span></label><input type="range" id="ph" min="150" max="420" step="5" value="${L.photoH}">
  <button class="ghost sm" id="pc" style="margin-top:8px">Centre photo</button></div>
 ${bigHTML(L)}<div style="text-align:right;margin:-6px 0 12px"><button class="ghost sm" id="swp">⇄ Swap Ask / Update</button></div>
 <div class="xs mut" style="margin:0 2px 6px">☝ Press and drag a tile to move it. 👁 = shown, 🚫 = hidden on all phones.</div>
 ${tilesHTML(L,true)}
 <div class="card" style="margin-top:12px"><b>🔲 Tiles</b><label class="l">Tile size</label><div class="seg">${[['s','Small'],['m','Medium'],['l','Large']].map(([v,l])=>`<button data-tsz="${v}" class="${L.tileSize===v?'on':''}">${l}</button>`).join('')}</div>
  <label class="l">Tiles per row</label><div class="seg">${[2,3,4].map(n=>`<button data-tcol="${n}" class="${+L.cols===n?'on':''}">${n}</button>`).join('')}</div></div>
 <div class="card"><b>🔠 Text size (whole app)</b><label class="l">Size <span id="tv">${L.textScale}%</span></label><input type="range" id="ts" min="80" max="140" step="5" value="${L.textScale}"><div class="xs mut">Text, buttons and boxes grow together, on every screen.</div></div>
 <div class="card"><b>✍️ Credit line</b><label class="l">Size <span id="cv">${L.creditSize}px</span></label><input type="range" id="cs" min="8" max="18" step="0.5" value="${L.creditSize}">
  <label class="l">Position</label><div class="seg">${[['left','Left'],['center','Centre'],['right','Right']].map(([v,l])=>`<button data-cal="${v}" class="${L.creditAlign===v?'on':''}">${l}</button>`).join('')}</div>
  ${creditHTML(L)}</div>
 <div class="card"><b>📱 Phone app icon</b><div class="s mut">Makes the 3 icon files for GitHub. Not part of Save.</div><button class="ghost" id="icb" style="width:100%;margin-top:8px">Make app icon files…</button></div>
 <button class="ghost" id="rst" style="width:100%;margin-bottom:12px">↺ Back to standard layout</button>`,
 {back:cancelEdit,foot:`<div class="foot"><button class="ghost" id="edc" style="flex:1">Cancel</button><button id="eds" style="flex:2">💾 Save for all phones</button></div>`});
 const img=$('#heroimg'),hero=$('#hero');const upd=()=>{if(img)img.setAttribute('style',imgStyle(L))};const mark=()=>{ED.dirty=true};
 panZoom(hero,()=>L,v=>{Object.assign(L,v);upd();mark();if(v.zoom){$('#pz').value=L.zoom;$('#zv').textContent=L.zoom.toFixed(1)+'×'}});
 $('#pz').oninput=e=>{L.zoom=+e.target.value;$('#zv').textContent=L.zoom.toFixed(1)+'×';upd();mark()};
 $('#ph').oninput=e=>{L.photoH=+e.target.value;$('#hv').textContent=L.photoH+'px';hero.style.height=L.photoH+'px';mark()};
 $('#pc').onclick=()=>{L.px=50;L.py=50;L.zoom=1;mark();renderEditHome()};
 $('#app').querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{L.photo=b.dataset.pk;L.px=50;L.py=50;L.zoom=1;mark();renderEditHome()});
 $('#pgal').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{L.photo=await fileToDataURL(f);L.px=50;L.py=50;L.zoom=1;mark();renderEditHome()}catch(err){toast('Could not read that picture')}};
 $('#swp').onclick=()=>{L.swapBig=!L.swapBig;mark();renderEditHome()};
 tileDrag($('#tiles'),ids=>{L.order=ids;mark()});
 $('#app').querySelectorAll('[data-eye]').forEach(s=>s.onclick=e=>{e.stopPropagation();const k=s.dataset.eye;L.hidden=L.hidden.includes(k)?L.hidden.filter(x=>x!==k):L.hidden.concat(k);mark();renderEditHome()});
 $('#app').querySelectorAll('[data-tsz]').forEach(b=>b.onclick=()=>{L.tileSize=b.dataset.tsz;mark();renderEditHome()});
 $('#app').querySelectorAll('[data-tcol]').forEach(b=>b.onclick=()=>{L.cols=+b.dataset.tcol;mark();renderEditHome()});
 $('#ts').oninput=e=>{L.textScale=+e.target.value;$('#tv').textContent=L.textScale+'%';applyScale(L);mark()};
 $('#cs').oninput=e=>{L.creditSize=+e.target.value;$('#cv').textContent=L.creditSize+'px';const c=$('#app').querySelector('.credit');if(c)c.style.fontSize=L.creditSize+'px';mark()};
 $('#app').querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{L.creditAlign=b.dataset.cal;mark();renderEditHome()});
 $('#rst').onclick=()=>{ED.L=JSON.parse(JSON.stringify(LDEF));ED.dirty=true;toast('Standard layout loaded – tap Save for all phones to keep it');renderEditHome()};
 $('#icb').onclick=()=>{IC={src:BUILTIN[1][0],px:50,py:50,zoom:1};openIcon()};
 $('#edc').onclick=cancelEdit;$('#eds').onclick=saveLayout}
function cancelEdit(){if(ED&&ED.dirty&&!cancelEdit.c){cancelEdit.c=1;toast('Changes not saved – tap Cancel again to throw them away',3500);setTimeout(()=>cancelEdit.c=0,3500);return}
 cancelEdit.c=0;ED=null;applyScale(lay());render()}
async function saveLayout(){const b=$('#eds');if(!navigator.onLine){toast('Needs internet to save the layout for all phones. Your edits stay here – try again when online.',4500);return}
 b.disabled=true;b.textContent='Saving…';
 try{const L=ED.L;const r=await api('layout',{layout:L},120000);S.layout=L;await DB.put('kv',L,'layout');await DB.put('kv',r.layoutStamp,'layoutStamp');ED=null;applyScale(lay());render();
  toast('✅ Layout saved. Other phones get it at their next Send / Receive.',4500,true)}
 catch(e){toast('Not saved: '+e.message,4500);b.disabled=false;b.textContent='💾 Save for all phones'}}
/* --- app icon maker (sheet) --- */
function openIcon(){
 sheet(`<div class="h2">📱 App icon</div>
 <div class="pick">${BUILTIN.map(([f,l])=>`<button class="pk${IC.src===f?' on':''}" data-ic="${f}"><img src="${f}" alt=""><span>${l}</span></button>`).join('')}<label class="pk${/^data:/.test(IC.src)?' on':''}"><input type="file" accept="image/*" id="igal" hidden><span class="gal">🖼️</span><span>Gallery</span></label></div>
 <div class="icbox" id="icbox"><img id="icimg" src="${esc(IC.src)}" alt="" style="${imgStyle(IC)}"><div class="icsafe"></div></div>
 <div class="xs mut" style="text-align:center;margin-top:4px">☝ Drag to move, pinch to zoom. Keep the ship inside the dotted circle – Android may cut the corners.</div>
 <label class="l">Zoom</label><input type="range" id="iz" min="1" max="4" step="0.05" value="${IC.zoom}">
 <button id="icmk" style="width:100%;margin-top:12px">⬇ Create icon files (zip)</button>
 <div class="xs mut" id="icm" style="margin-top:8px">Then on GitHub: <b>Add file → Upload files</b> → the 3 files from the zip (icon-192.png, icon-512.png, apple-touch-icon.png) → Commit. Android phones change the icon by themselves in about 1–3 days. iPhones: remove the app from the home screen and add it again.</div>
 <button class="ghost" id="icx" style="width:100%;margin-top:10px">Close</button>`);
 const sh=$('#sheetIn');const im=$('#icimg');
 panZoom($('#icbox'),()=>IC,v=>{Object.assign(IC,v);im.setAttribute('style',imgStyle(IC));if(v.zoom)$('#iz').value=IC.zoom});
 $('#iz').oninput=e=>{IC.zoom=+e.target.value;im.setAttribute('style',imgStyle(IC))};
 sh.querySelectorAll('[data-ic]').forEach(b=>b.onclick=()=>{IC={src:b.dataset.ic,px:50,py:50,zoom:1};openIcon()});
 $('#igal').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{IC={src:await fileToDataURL(f),px:50,py:50,zoom:1};openIcon()}catch(err){toast('Could not read that picture')}};
 $('#icx').onclick=closeSheet;
 $('#icmk').onclick=async()=>{const b=$('#icmk');b.disabled=true;b.textContent='Creating…';
  try{const img=await loadImg(IC.src);const files=[];for(const [n,z] of [['icon-512.png',512],['icon-192.png',192],['apple-touch-icon.png',180]])files.push({name:n,data:await pngBytes(img,z,IC)});
   downloadBlob(makeZip(files),'FrontDuke_App_Icons.zip');$('#icm').insertAdjacentHTML('afterbegin','<b style="color:var(--ok)">✔ FrontDuke_App_Icons.zip downloaded.</b><br>')}
  catch(e){toast('Could not create icons: '+e.message)}b.disabled=false;b.textContent='⬇ Create icon files (zip)'}}
/* ================= boot ================= */
let SWREG=null;
async function boot(){try{await loadState()}catch(e){$('#app').innerHTML='<div style="padding:20px">This browser blocks offline storage (private mode?). Open the app in normal Safari/Chrome.</div>';return}
 render();if(S.user&&D)autoSync();
 setInterval(()=>{if(S.user&&D)sendReceive(false)},60*60*1000);
 window.addEventListener('online',()=>{if(S.user&&D)sendReceive(false)});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.user&&D)autoSync()});
 if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{SWREG=await navigator.serviceWorker.register('sw.js');
  const ask=w=>{const b=document.createElement('div');b.className='toast';b.style.display='block';b.style.bottom='auto';b.style.top='calc(70px + env(safe-area-inset-top))';b.innerHTML='New version available <button class="sm" style="margin-left:8px">Update</button>';document.body.appendChild(b);b.querySelector('button').onclick=()=>{S.updateAsked=true;w.postMessage('skip')}};
  if(SWREG.waiting)ask(SWREG.waiting);
  SWREG.addEventListener('updatefound',()=>{const w=SWREG.installing;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ask(w)})});
  let rl=false;const hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!rl&&S.updateAsked){rl=true;location.reload()}});setInterval(()=>SWREG.update(),30*60*1000)}catch(e){}}}
boot();
</script>
