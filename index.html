<style>
:root{--navy:#0b2942;--navy2:#123a5c;--sea:#1f7ab8;--sky:#e8f2fa;--bg:#f2f5f8;--card:#fff;--ink:#13212e;--mut:#5d6d7a;--line:#dce3ea;--ok:#17803f;--okb:#e3f4e9;--warn:#9a5a00;--warnb:#fff1d6;--bad:#b3261e;--badb:#fde7e4;--chip:#eef2f6;--deck:#1f7ab8;--eng:#c2571a;--r:16px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding-bottom:calc(70px + env(safe-area-inset-bottom))}

button{border:0;border-radius:12px;padding:12px 16px;background:var(--sea);color:#fff;font-weight:600;cursor:pointer;touch-action:manipulation}

button.ghost{background:var(--chip);color:var(--ink)}button.sm{padding:7px 11px;font-size:14px;border-radius:10px}button.danger{background:var(--bad)}
input,select,textarea{width:100%;min-width:0;max-width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;outline:none}

label.l{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
.top{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .t{flex:1;font-weight:700;font-size:17px;line-height:1.2}.top .t small{display:block;font-weight:400;opacity:.75;font-size:12px}

.sync{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;color:#fff}
.badge{background:#ff4d4f;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
main{padding:14px 16px;max-width:760px;margin:0 auto}

.hero{position:relative;border-radius:22px;overflow:hidden;min-height:230px;background:linear-gradient(160deg,#0b2942 0%,#174d77 55%,#2b85c1 100%);color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:14px}

.hero.hasimg svg.ship{display:none}.credit{text-align:right;font-size:10.5px;color:var(--mut);margin:14px 2px 0;line-height:1.5;opacity:.85}
.login-tabs{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px}.login-tabs button{flex:1;background:none;color:var(--ink);padding:10px}.login-tabs button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.toast.green{background:#17803f}.banner.test{background:#fff3b0;color:#6b5200;border:1px dashed #c9a400}.chip.test{background:#fff3b0;color:#6b5200}
.tl{position:relative;margin:6px 0 0 6px;padding-left:16px;border-left:2px solid var(--line)}.tl .ev{position:relative;margin:0 0 12px}.tl .ev:before{content:'';position:absolute;left:-23px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--sea)}.tl .ev.mail:before{background:#7a4cc2}.tl .ev.ship:before{background:var(--ok)}.tl .ev .d{font-size:12px;font-weight:700}.tl .ev .w{font-size:12px;color:var(--mut)}.tl .ev .x{font-size:13.5px;white-space:pre-wrap;margin-top:2px}
.chip.transit{background:#e3f0fb;color:#1f6fa8}
.hero svg.ship{position:absolute;right:-10px;bottom:38px;width:88%;opacity:.25}
.hero .txt{position:relative}.hero h1{margin:0;font-size:24px;letter-spacing:.3px}.hero p{margin:2px 0 0;opacity:.85;font-size:13.5px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.bigbtn{border-radius:20px;padding:20px 14px;min-height:118px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;font-size:18px;box-shadow:0 6px 18px rgba(11,41,66,.18)}

.bigbtn.ask{background:linear-gradient(150deg,#123a5c,#1f7ab8)}.bigbtn.upd{background:linear-gradient(150deg,#b44c12,#e07a2c)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}

.h2{font-size:20px;font-weight:700;margin:4px 0 12px}

.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;padding:4px}

.thumb .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:26px;height:26px;padding:0;font-size:14px}
.item{padding:12px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.jid{font-weight:700;color:var(--sea);font-variant-numeric:tabular-nums}
.entry{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sea);border-radius:14px;padding:12px;margin-bottom:10px}
.entry.Engine{border-left-color:var(--eng)}.entry.meeting{border-left-color:#7a4cc2}
.entry .who{font-size:13px;color:var(--mut)}.entry .txt{margin:6px 0;white-space:pre-wrap}
.minis{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.minis .m{width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center}
.minis .m img{width:100%;height:100%;object-fit:cover}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.seg button{background:var(--chip);color:var(--ink);padding:8px 12px;font-size:14px}.seg button.on{background:var(--sea);color:#fff}
.banner{background:var(--warnb);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;font-weight:600}
.banner.ok{background:var(--okb);color:var(--ok)}.banner.info{background:var(--sky);color:var(--sea)}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.sheet.show{display:flex}.sheet .in{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.viewer{position:fixed;inset:0;z-index:40;background:#000;display:none;align-items:center;justify-content:center}.viewer.show{display:flex}.viewer img{max-width:100%;max-height:100%}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:6px 10px;font-size:14px}.kv>div:nth-child(odd){color:var(--mut)}
pre.scope{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);padding:10px;border-radius:10px;max-height:50vh;overflow:auto}
.toast{white-space:pre-line;text-align:center;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#13212e;color:#fff;padding:11px 16px;border-radius:12px;z-index:50;font-size:14px;max-width:92%;display:none}
.timer{font-size:42px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.live{min-height:120px;max-height:40vh;overflow:auto;background:var(--bg);border-radius:12px;padding:10px;font-size:14px;white-space:pre-wrap}
.hidden{display:none!important}
.login{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(170deg,#0b2942,#174d77 60%,#2b85c1);color:#fff;padding:calc(30px + env(safe-area-inset-top)) 20px 30px}
.login .card{color:var(--ink);margin-top:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}table.t td,table.t th{border:1px solid var(--line);padding:5px;text-align:left;vertical-align:top}
</style>

<script>
"use strict";
/* ================= constants ================= */
const VERSION='1.6.0';
const CFG=Object.assign({SERVER_URL:'',VESSEL:'MT Front Duke'},window.APP_CONFIG||{});
const RANKS=[['Master','Deck'],['Chief Officer','Deck'],['Second Officer','Deck'],['Third Officer','Deck'],['Deck Cadet','Deck'],['Chief Engineer','Engine'],['Second Engineer','Engine'],['Third Engineer','Engine'],['Fourth Engineer','Engine'],['Electrical Engineer','Engine'],['Superintendent','Office'],['Yard visitor','Office']];
const REPORT_RANKS=['Chief Engineer','Master','Chief Officer','Second Engineer','Vessel Manager'];
const STAT=['Not started','In progress / given to yard','Received back','Done','Class/Owner accepted'];
const STC=['','warn','','ok','ok'];
const PERF=[['Yard','Yard job','🏗️','Work done by COSCO yard'],['Service Engineer','Service engineer job','🧰','Maker / service engineer attendance'],['Ship Staff','Ship staff job','⚓','Work by our own crew']];
const OUT=new Set(['350.03','710.01','740.02']);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(t,ms,green){const e=$('#toast');e.classList.toggle('green',!!green);e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',ms||2600)}
/* ================= IndexedDB ================= */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('fduke_dd2026',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('entries',{keyPath:'id'});d.createObjectStore('blobs')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 get(store,k){return this.tx(store,'readonly',s=>s.get(k))},put(store,v,k){return this.tx(store,'readwrite',s=>k===undefined?s.put(v):s.put(v,k))},
 del(store,k){return this.tx(store,'readwrite',s=>s.delete(k))},all(store){return this.tx(store,'readonly',s=>s.getAll())}};
/* ================= state ================= */
let S={user:null,data:null,entries:[],lastSync:0,since:0,syncing:false,reportHour:18,view:'home'};
let D=null,J={},O={},IDX=null;
async function loadState(){await DB.open();S.user=await DB.get('kv','user')||null;S.lastSync=await DB.get('kv','lastSync')||0;S.since=await DB.get('kv','since')||0;S.reportHour=await DB.get('kv','reportHour')||18;S.testMode=!!(await DB.get('kv','testMode'));
 const raw=await DB.get('kv','records');if(raw)setData(raw);S.entries=await DB.all('entries');
 const th=await DB.get('kv','theme');if(th)document.documentElement.setAttribute('data-theme',th)}
function setData(raw){D=typeof raw==='string'?JSON.parse(raw):raw;J={};O={};D.jobs.forEach(j=>J[j.id]=j);D.orders.forEach(o=>O[o.no]=o);
 IDX={jobs:D.jobs.map(j=>({r:j,f:[[norm(j.id+' '+j.title),6],[norm(j.comp+' '+j.group+' '+(j.components||[]).join(' ')),4],[norm(j.brief+' '+j.sname),3],[norm(j.scope),1]]})),
 orders:D.orders.map(o=>({r:o,f:[[norm(o.no+' '+o.name),6],[norm(o.suppliers.map(s=>s.name).join(' ')+' '+o.jobs.map(x=>x.id+' '+(J[x.id]?J[x.id].title:'')).join(' ')),3],[norm(o.status+' '+o.loc+' '+o.notes.join(' ')),1]]})),
 motors:D.motors.map(m=>({r:m,f:[[norm(m.motor+' '+m.job+' '+m.std+' '+m.po),5]]})),
 msgs:(D.msgs||[]).map(m=>({r:m,f:[[norm(m.subj+' '+m.pos.join(' ')+' '+m.jobs.join(' ')),5],[norm(m.frm),2],[norm(m.text),1]]})),docs:D.docs.map(d=>({r:d,f:[[norm(d.text),1]]})),entries:[]}}
function rebuildEntryIdx(){if(!IDX)return;IDX.entries=live().map(e=>({r:e,f:[[norm((e.text)+' '+(e.transcript||'')+' '+(e.job||'')+' '+(e.jobTitle||'')+' '+(e.order||'')),3],[norm(e.rank+' '+e.name),1]]}))}
const live=()=>S.entries.filter(e=>!e.deleted);
const pending=()=>S.entries.filter(e=>e.pending).length+0;
/* ================= search engine (records) ================= */
const GROUPS=[
['main engine','m/e','me ','m.e','w7x82','w-7x','propulsion engine','main eng'],['aux engine','auxiliary engine','a/e','ae ','generator engine','diesel generator','d/g','dg ','g/e','ge ','himsen','genset'],
['fuel oil','f.o','fo ','fuel pump','fuel'],['lube oil','lub oil','l.o','lo ','lubricating'],['sea water','s.w','sw ','seawater'],['fresh water','f.w','fw '],
['overboard','ovb','o/b','ship side valve','sea chest','sea valve'],['pipe','pipes','piping','pipeline','pipe line','pipelines','spool piece'],
['fabricat','fabrication','fabricate','crop','insert','doubler','steel renewal','new frame','bracket','railing'],['vent fan','ventilation','ventilator','e/r fan','er fan','e/r vent'],['engine room','e/r','er ','e.r'],['blower','blowers'],
['turbocharger','t/c','tc ','turbo'],['egcs','scrubber','exhaust gas cleaning'],['bwts','ballast water treatment','nk-o3','nko3'],['iccp','impressed current','anode'],
['inert gas','igs','ig fan','ig blower','i.g'],['copt','cargo oil pump turbine','cargo pump turbine'],['cargo oil pump','cop '],['purifier','separator','alfa laval'],
['compressor','air compressor'],['bearing','bearings','mearing'],['motor','motors','electric motor','electro motor'],['valve','valves'],['cooler','coolers','heat exchanger'],
['boiler','donkey','economizer','egb','exhaust gas boiler'],['incinerator','refractory'],['sewage','stp','grey water','gray water','black water'],['ows','oily water separator','odme'],
['fwg','fresh water generator','evaporator'],['air condition','a/c','ac plant','aircon','ahu','hvac'],['provision','reefer','refrigeration'],['steering','steering gear','rudder'],
['stern tube','sterntube','tail shaft','tailshaft','propeller shaft','shaft seal'],['propeller','pbcf'],['paint','coating','blasting','hull treatment'],['tank','tanks','cot','wbt'],
['crane','cranes','hose handling'],['windlass','mooring winch','mooring','bollard'],['lifeboat','davit','rescue boat','lsa'],['co2','fire extinguishing'],['fire pump','fire & g.s','fire and gs','fire main'],
['switchboard','msb','esb','breaker','acb'],['alternator','generator','avr','diode'],['vfd','frequency drive','inverter','frese','fuel save','fuelsave'],['gasket','gaskets','o-ring','o ring'],
['hydraulic','hpu','servo oil','hydraulics'],['crankcase','crank case'],['ecdis','radar','gmdss','echo sounder','speed log','speedlog'],['gas detection','fgds','gas sampling'],['governor','woodward'],
['accumulator'],['quick closing','qcv'],['staging','scaffolding'],['thickness','gauging','utm'],['class','surveyor','dnv'],['spares','spare','parts','requisition','reqn','po ','order','supplied'],
['received','arrived','landed'],['air cooler','charge air cooler','scavenge air cooler']];
const STOP=new Set('a an the of for to in on at is are was were we have has had do does did any all what whats which who whom how when where give me show list tell about with and or by from our my is it its this that be been job jobs work works please status details detail item items there their'.split(' '));
const norm=s=>' '+String(s||'').toLowerCase().replace(/[“”"'`]/g,'').replace(/[(),;:!?\[\]]/g,' ').replace(/\s+/g,' ')+' ';
function stem(w){return w.replace(/(ing|ings|ed|es|s)$/,'').replace(/\.$/,'')}
function parseQ(q){let s=norm(q);const concepts=[];
 const all=[];GROUPS.forEach((g,gi)=>g.forEach(p=>all.push([p,gi])));all.sort((a,b)=>b[0].length-a[0].length);
 const used=new Set();
 for(const [p,gi] of all){const pp=p.endsWith(' ')?p:p;const re=new RegExp('(^|[^a-z0-9])'+pp.trim().replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+(p.endsWith(' ')?'(?![a-z0-9])':''),'i');
  if(re.test(s)){if(!used.has(gi)){concepts.push({g:gi,terms:GROUPS[gi]});used.add(gi)}s=s.replace(re,' ')}}
 s.split(' ').filter(w=>w&&!STOP.has(w)&&w.length>1).forEach(w=>concepts.push({w:stem(w)}));
 return concepts}
function hit(text,c){if(c.g!=null)return c.terms.some(t=>{const tt=t.trim();return tt.length<=3?new RegExp('(^|[^a-z0-9])'+tt.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+'([^a-z0-9]|$)').test(text):text.includes(tt)});
 if(/^\d/.test(c.w))return text.includes(c.w);return new RegExp('(^|[^a-z0-9])'+c.w.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')).test(text)}
function rank(list,cs,strict){const out=[];for(const it of list){let sc=0,m=0;for(const c of cs){let best=0;for(const [t,w] of it.f)if(hit(t,c))best=Math.max(best,w);if(best){m++;sc+=best}}

 S.syncing=true;renderTop();let up=0,dn=0,sent=0,fileFail=0;const wantMsg=saveMode||S.saveAfter;S.saveAfter=false;
 try{
  for(const e of S.entries.filter(x=>x.device===S.user.device&&(x.files||[]).some(f=>!f.driveId))){
   for(const f of (e.files||[])){if(f.driveId)continue;const b=await DB.get('blobs',f.fid);if(!b)continue;

  if(r.testMode!=null){S.testMode=!!r.testMode;await DB.put('kv',S.testMode,'testMode')}
  S.since=Math.max(0,r.serverTime-5000);S.lastSync=Date.now();if(r.reportHour!=null)S.reportHour=r.reportHour;
  await DB.put('kv',S.since,'since');await DB.put('kv',S.lastSync,'lastSync');await DB.put('kv',S.reportHour,'reportHour');
  S.entries=await DB.all('entries');rebuildEntryIdx();
  if(r.dataStamp&&r.dataStamp!==(await DB.get('kv','dataStamp'))){try{const rr=await api('records',{},120000);await DB.put('kv',rr.data,'records');await DB.put('kv',rr.dataStamp,'dataStamp');setData(rr.data);rebuildEntryIdx();toast('Drydock records updated ✔')}catch(e){}}
  const ff=fileFail?`\n⚠ ${fileFail} photo/file not sent yet – it will retry automatically`:'';
  if(manual)toast(`✅ Sent updates to CE Sethu Database successfully\n(${sent} update(s) sent${up?', '+up+' photo/file(s)':''}, ${dn} received)`+ff,4500,true);
  else if(wantMsg)toast('✅ Update sent to CE Sethu Database successfully'+ff,4000,true);
 }catch(err){if(manual||wantMsg)toast('📱 Your update is SAFE on this phone.\nNot sent yet ('+String(err.message||err).slice(0,60)+').\nIt will be sent automatically – or press Send / Receive later.',6000)}

  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  const b=await new Promise(res=>c.toBlob(res,'image/jpeg',0.8));return b&&b.size<file.size?b:file}catch(e){return file}}

function answer(q){const ql=q.toLowerCase();

 const wantsSp=/spare|reqn|requisition|\bpo\b|order|received|supplier|deliver|arriv/.test(ql);const wantsAp=/approv|class|surveyor|owner|witness|attend/.test(ql);
 const qq=q.replace(/\b(spares?|requisitions?|reqns?|received|receive|supplier|po|orders?|status|approvals?|needed|required|have we|did we|jobs?|who does|who|does)\b/gi,' ').trim()||q;
 const jr=search(qq,'jobs',40).map(x=>x.r);let orr=search(qq,'orders',wantsSp?25:6).map(x=>x.r);if(wantsSp){const via=D.orders.filter(o=>o.jobs.some(x=>jr.slice(0,10).some(j=>j.id===x.id)));orr=[...new Set(orr.concat(via))]}

 const terms=qq.split(/\s+/).filter(w=>w.length>3);const mr=search(qq,'msgs',12).map(x=>x.r).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));

   else{m.innerHTML='✔ Report is large – <a href="'+esc(r.url)+'" target="_blank" rel="noopener">open it from Google Drive</a>'}}
  catch(e){m.textContent='Report failed: '+e.message}finally{$('#rD').disabled=$('#rE').disabled=!ok}};
 $('#rD').onclick=()=>gen('Deck');$('#rE').onclick=()=>gen('Engine');
 const rj=$('#rj');rj.oninput=()=>{RP.job=rj.value.trim();$('#rjn').textContent=J[RP.job]?J[RP.job].title:(RP.job.length>=6?'Not a DD spec job number':'')};

 $('#rjf').onchange=e=>{RP.jf=e.target.value};$('#rjt').onchange=e=>{RP.jt=e.target.value};
 $('#rJ').onclick=async()=>{const job=rj.value.trim(),m=$('#rjm');if(!/^\d{3}\.\d{2}$/.test(job)){m.textContent='Type a job number like 630.13';return}
  if(!navigator.onLine){toast('Needs internet');return}if(RP.jf&&RP.jt&&RP.jt<RP.jf){toast('"To" date is before "From"');return}
  $('#rJ').disabled=true;try{m.textContent='Sending latest updates…';await sendReceive(false);m.textContent='Building the report for '+job+' – this can take a minute…';
   const r=await api('report',{kind:'job',job,from:RP.jf||'',to:RP.jt||'',rank:S.user.rank,name:S.user.name},360000);
   if(r.b64){downloadBlob(b64ToBlob(r.b64,'application/vnd.openxmlformats-officedocument.wordprocessingml.document'),r.name);m.innerHTML='✔ '+esc(r.name)+' downloaded. Also saved in Google Drive › Reports.'}
   else m.innerHTML='✔ Report is large – <a href="'+esc(r.url)+'" target="_blank" rel="noopener">open it from Google Drive</a>'}
  catch(e){m.textContent='Report failed: '+e.message}finally{$('#rJ').disabled=!ok}}}
function downloadBlob(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
/* ---------- extract photos (zip built on the phone) ---------- */
let PX={date:today(),from:'',to:'',dept:'All'};
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){const enc=new TextEncoder();const parts=[],central=[];let off=0;const d=new Date();
 const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
 for(const f of files){const name=enc.encode(f.name),data=f.data,crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
  h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
  parts.push(new Uint8Array(h.buffer),name,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
  c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  central.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length}
 const csize=central.reduce((a,x)=>a+x.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
 return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/zip'})}
async function getBlob(f){let b=await DB.get('blobs',f.fid);if(!b&&f.driveId&&navigator.onLine&&CFG.SERVER_URL){const r=await api('file',{driveId:f.driveId},180000);b=b64ToBlob(r.b64,r.mime);await DB.put('blobs',b,f.fid)}return b||null}
const safeName=t=>String(t||'Update').replace(/[\\/:*?"<>|\r\n\t]+/g,' ').replace(/\s+/g,' ').trim().replace(/^(.{90}).*$/,(m,x)=>x.replace(/\s+\S*$/,'')).replace(/[. ]+$/,'')||'Update';
function photoEntries(){return live().filter(e=>e.date===PX.date&&(!PX.from||e.time>=PX.from)&&(!PX.to||e.time<=PX.to)&&(PX.dept==='All'||e.dept===PX.dept||e.kind==='meeting')&&(e.files||[]).some(f=>/^image\//.test(f.mime))).sort((a,b)=>String(a.ts).localeCompare(String(b.ts)))}
function renderPhotos(){if(!canReport()){go('home');return}const L=photoEntries();const n=L.reduce((a,e)=>a+e.files.filter(f=>/^image\//.test(f.mime)).length,0);
 shell('Extract photos','Zip of all photos for one day',`<div class="card"><label class="l">Date (required)</label><input type="date" id="pxd" value="${PX.date}">
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="min-width:0"><label class="l">From time (optional)</label><input type="time" id="pxf" value="${PX.from}"></div><div style="min-width:0"><label class="l">To time (optional)</label><input type="time" id="pxt" value="${PX.to}"></div></div>
 <label class="l">Department</label><div class="seg">${['All','Deck','Engine'].map(d=>`<button data-px="${d}" class="${PX.dept===d?'on':''}">${d==='Engine'?'Engine & Elec.':d}</button>`).join('')}</div>
 <div class="banner info" style="margin-top:10px">${L.length} update(s) with ${n} photo(s). One folder per update, named after the update.</div>
 <button id="pxgo" style="width:100%" ${n?'':'disabled'}>🗂️ Create zip and download</button><div class="xs mut" id="pxm" style="margin-top:8px">Send / Receive runs first so photos from all phones are included. Needs internet for photos taken on other phones.</div></div>`,{back:()=>go('home')});
 $('#pxd').onchange=e=>{PX.date=e.target.value;renderPhotos()};$('#pxf').onchange=e=>{PX.from=e.target.value;renderPhotos()};$('#pxt').onchange=e=>{PX.to=e.target.value;renderPhotos()};
 $('#app').querySelectorAll('[data-px]').forEach(b=>b.onclick=()=>{PX.dept=b.dataset.px;renderPhotos()});
 $('#pxgo').onclick=async()=>{if(!PX.date){toast('Choose a date');return}const m=$('#pxm');$('#pxgo').disabled=true;
  try{if(navigator.onLine){m.textContent='Syncing first…';await sendReceive(false)}
   const list=photoEntries();const used={};const files=[];const idx=['Front Duke DD 2026 – photos '+PX.date+(PX.from||PX.to?' '+(PX.from||'00:00')+'-'+(PX.to||'23:59'):'')+' – '+PX.dept,''];let k=0,miss=0;const tot=list.reduce((a,e)=>a+e.files.filter(f=>/^image\//.test(f.mime)).length,0);
   for(const e of list){let base=safeName(e.kind==='meeting'?'Daily meeting':(e.text));let name=base,c=2;while(used[name])name=base+' ('+(c++)+')';used[name]=1;
    idx.push(name+'  |  '+e.date+' '+e.time+'  |  '+e.dept+'  |  '+(e.text||''));let i=1;
    for(const f of e.files.filter(f=>/^image\//.test(f.mime))){k++;m.textContent=`Collecting photo ${k} of ${tot}…`;const b=await getBlob(f).catch(()=>null);if(!b){miss++;continue}
     files.push({name:name+'/photo_'+(i++)+'.jpg',data:new Uint8Array(await b.arrayBuffer())})}}
   files.push({name:'_list_of_updates.txt',data:new TextEncoder().encode(idx.join('\r\n'))});
   m.textContent='Making zip…';const z=makeZip(files);const fn='FrontDuke_Photos_'+PX.date+(PX.from||PX.to?'_'+(PX.from||'0000').replace(':','')+'-'+(PX.to||'2359').replace(':',''):'')+'_'+PX.dept+'.zip';
   downloadBlob(z,fn);m.textContent=`✔ ${fn} – ${files.length-1} photo(s)${miss?', '+miss+' could not be downloaded (sync later)':''}`}
  catch(e){m.textContent='Failed: '+e.message}finally{$('#pxgo').disabled=false}}}
/* ---------- settings ---------- */
function renderSettings(){const all=S.entries.length;
 shell('Settings',`App version ${VERSION}`,`<div class="card"><div class="kv"><div>Logged in</div><div>${esc(S.user.rank)} – ${esc(S.user.name)}${isChief()?' <span class="chip ok">Master account</span>':role()==='vm'?' <span class="chip">Vessel Manager</span>':''}</div><div>Department</div><div>${esc(S.user.dept)}</div>
 <div>Entries on phone</div><div>${all} (${pending()} not sent)</div><div>Last sync</div><div>${S.lastSync?new Date(S.lastSync).toLocaleString():'never'}</div><div>Records</div><div>${esc(D.built)} · ${D.jobs.length} jobs · ${D.orders.length} reqns</div></div></div>
 ${isChief()?`<div class="card"><b>🧪 Test mode</b><div class="s mut">${S.testMode?'ON – every new entry is marked TEST on all phones.':'OFF – entries are live drydock records.'}</div><div style="display:flex;gap:8px;margin-top:8px"><button id="tmon" ${S.testMode?'disabled':''}>Turn ON</button><button class="ghost" id="tmoff" ${S.testMode?'':'disabled'}>Turn OFF</button></div>
 <button class="danger" id="purge" style="width:100%;margin-top:10px">🗑 Delete ALL test entries and their photos</button><div class="xs mut" style="margin-top:4px">Removes them from Google Sheet, Drive and every phone, and switches Test mode OFF. Cannot be undone.</div></div>`:''}
 ${isChief()?`<div class="card"><b>Daily email time (ship time)</b><div style="display:flex;gap:8px;margin-top:8px"><select id="rh">${[...Array(24).keys()].map(h=>`<option value="${h}" ${h===S.reportHour?'selected':''}>${pad(h)}:00</option>`).join('')}</select><button id="rhs">Save</button></div></div>`:''}
 <div class="card"><b>Appearance</b><div class="seg">${[['','Auto'],['light','Light'],['dark','Dark']].map(([v,l])=>`<button data-th="${v}">${l}</button>`).join('')}</div></div>
 <div class="card"><button class="ghost" id="rr" style="width:100%">⟳ Re-download drydock records</button><button class="ghost" id="bk2" style="width:100%;margin-top:8px">⬇ Backup my entries (file)</button>
 <button class="danger" id="lo" style="width:100%;margin-top:8px">Log out of this phone</button><div class="xs mut" style="margin-top:6px">Log out is blocked while updates are not sent.</div></div>`,{back:()=>go('home')});
 if($('#rhs'))$('#rhs').onclick=async()=>{try{const r=await api('settings',{reportHour:+$('#rh').value});S.reportHour=r.reportHour;await DB.put('kv',S.reportHour,'reportHour');toast('Daily email set to '+pad(r.reportHour)+':00 ✔')}catch(e){toast(e.message)}};
 if($('#tmon')){const setTM=async on=>{try{const r=await api('settings',{testMode:on});S.testMode=r.testMode;await DB.put('kv',S.testMode,'testMode');toast('Test mode '+(on?'ON':'OFF')+' ✔');renderSettings()}catch(e){toast(e.message)}};$('#tmon').onclick=()=>setTM(true);$('#tmoff').onclick=()=>setTM(false);
  $('#purge').onclick=async()=>{const b=$('#purge');if(!b.dataset.c){b.dataset.c=1;b.textContent='Tap again – delete all TEST data';return}if(!b.dataset.c2){b.dataset.c2=1;b.textContent='Last check – tap to DELETE';return}
   b.disabled=true;b.textContent='Deleting…';try{await sendReceive(false);const r=await api('purgeTest',{},300000);for(const e of S.entries.filter(x=>x.test||r.ids.includes(x.id))){for(const f of (e.files||[]))await DB.del('blobs',f.fid);await DB.del('entries',e.id)}
    S.entries=await DB.all('entries');rebuildEntryIdx();S.testMode=false;await DB.put('kv',false,'testMode');toast(`✅ Deleted ${r.deleted} test entries and ${r.files} files. App is now LIVE.`,5000,true);renderSettings()}catch(e){toast(e.message);b.disabled=false}}}
 $('#app').querySelectorAll('[data-th]').forEach(b=>b.onclick=async()=>{const v=b.dataset.th;if(v)document.documentElement.setAttribute('data-theme',v);else document.documentElement.removeAttribute('data-theme');await DB.put('kv',v,'theme')});
 $('#rr').onclick=()=>{S.view='home';fetchRecords()};
 $('#bk2').onclick=()=>downloadBlob(new Blob([JSON.stringify({exported:new Date().toISOString(),user:{rank:S.user.rank,name:S.user.name},entries:S.entries},null,1)],{type:'application/json'}),'FrontDuke_DD2026_backup_'+today()+'.json');
 $('#lo').onclick=async()=>{if(pending()){toast('Send / Receive first – '+pending()+' update(s) not sent',4000);return}if(!$('#lo').dataset.c){$('#lo').dataset.c=1;$('#lo').textContent='Tap again to log out';return}await DB.del('kv','user');S.user=null;render()}}
/* ================= boot ================= */
let SWREG=null;
async function boot(){try{await loadState()}catch(e){$('#app').innerHTML='<div style="padding:20px">This browser blocks offline storage (private mode?). Open the app in normal Safari/Chrome.</div>';return}
 render();if(S.user&&D)autoSync();
 setInterval(()=>{if(S.user&&D)sendReceive(false)},60*60*1000);
 window.addEventListener('online',()=>{if(S.user&&D)sendReceive(false)});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.user&&D)autoSync()});
 if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{SWREG=await navigator.serviceWorker.register('sw.js');
  const ask=w=>{const b=document.createElement('div');b.className='toast';b.style.display='block';b.style.bottom='auto';b.style.top='calc(70px + env(safe-area-inset-top))';b.innerHTML='New version available <button class="sm" style="margin-left:8px">Update</button>';document.body.appendChild(b);b.querySelector('button').onclick=()=>{S.updateAsked=true;w.postMessage('skip')}};
  if(SWREG.waiting)ask(SWREG.waiting);
  SWREG.addEventListener('updatefound',()=>{const w=SWREG.installing;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ask(w)})});
  let rl=false;const hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!rl&&S.updateAsked){rl=true;location.reload()}});setInterval(()=>SWREG.update(),30*60*1000)}catch(e){}}}
boot();
